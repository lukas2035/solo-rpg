services:
  db:
    image: pgvector/pgvector:pg17
    container_name: solo-rpg-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: solo
      POSTGRES_PASSWORD: solo
      POSTGRES_DB: solo_rpg
    volumes:
      # bind mount – záloha = zastavit + zazipovat ./data (viz docs/ARCHITECTURE_V2.md §2.2)
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solo -d solo_rpg"]
      interval: 5s
      timeout: 3s
      retries: 10
